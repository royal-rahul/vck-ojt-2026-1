{% extends 'layout.html' %}

{% block content %}

<h2>Add Task</h2>

<form method="POST">

    <div class="row mt-4">

        <div class="col-md-6">

            <label class="form-label">
                Task Title
            </label>

            <input
                type="text"
                name="task_title"
                class="form-control"
                required
            >

        </div>

        <div class="col-md-3">

            <label class="form-label">
                Due Date
            </label>

            <input
                type="date"
                name="due_date"
                class="form-control"
                required
            >

        </div>

        <div class="col-md-3">

            <label class="form-label">
                Maximum Marks
            </label>

            <input
                type="number"
                name="maximum_marks"
                class="form-control"
                required
            >

        </div>

    </div>


    <div class="row mt-3">

        <div class="col-md-12">

            <label class="form-label">
                Task Description
            </label>

            <textarea
                name="task_description"
                class="form-control"
                rows="4"
                required
            ></textarea>

        </div>

    </div>


    <button
        type="submit"
        class="btn btn-primary mt-4"
    >
        Save Task
    </button>

</form>

{% endblock %}
